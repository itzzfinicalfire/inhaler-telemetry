name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test
        run: ./gradlew :plugin:test --no-daemon --stacktrace

      - name: Build jar
        run: ./gradlew :plugin:jar --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: forensic-telemetry
          path: plugin/build/libs/*.jar
