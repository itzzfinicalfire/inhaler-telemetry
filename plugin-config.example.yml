# forensic-telemetry - example plugin configuration
#
# REPORT-ONLY. No key in this file can make the plugin punish, move, damage, or
# otherwise act on a player. Keys that would imply such behaviour are rejected
# at startup; see TelemetryConfig.FORBIDDEN_KEYS.
#
# Copy this file to plugins/ForensicTelemetry/config.yml (capital F and T),
# replace every CHANGE_ME value, then set telemetry.enabled: true.

telemetry:
  enabled: false

endpoint:
  # Stable ingest URL. Put a reverse proxy or TLS terminator in front if the
  # path between this server and the ingest host is not trusted.
  url: "https://ingest.example.com/v1/telemetry"

server:
  # Must match a row in the ingest service's server table, UUID format.
  id: "00000000-0000-0000-0000-000000000000"
  key-id: "k1"
  # Shared HMAC secret. Lives only in this file and process memory; never
  # logged, never uploaded.
  key-secret: "CHANGE_ME_AT_LEAST_16_RANDOM_CHARACTERS"

buffer:
  bytes: 67108864
  chunk-bytes: 65536

encoder:
  resync-interval-ticks: 40

flush:
  interval-ms: 2000
  max-bytes: 65536
  max-batch-chunks: 16

upload:
  max-inflight: 2
  backoff-initial-ms: 1000
  backoff-max-ms: 60000
  timestamp-skew-tolerance-ms: 30000

schema:
  # v2 adds intra-tick ordering and combat-mechanic records. The reader still
  # decodes v1 segments.
  record-version: 2
  envelope-version: 2

capture:
  # Per-family listener toggles. These stop records from being offered; state,
  # attacks, damage, deaths and gaps are always captured, so disabling a family
  # never hides that a session happened.
  crystal: true
  anchor: true
  slot-swap: true
  interact: true
  swing: true
  # Fall distance, attack cooldown, held category, victim category, and wind
  # charge launches. This is the mace/crit family.
  attack-context: true

console-report:
  # Read-only shadow measurements printed to the server console. This NEVER
  # kicks, bans, damages, or moves anyone: every line is labelled SHADOW_ONLY.
  enabled: false
  interval-seconds: 30
  # Must match the read-only report token on the ingest side.
  token: "CHANGE_ME_AT_LEAST_16_RANDOM_CHARACTERS"
